<!DOCTYPE html>
<html lang="it" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Privata | Plot Twisters!</title>
    <meta name="description" content="Accedi all'area privata del club Plot Twisters.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Cormorant:ital,wght@1,300;1,400;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── Login page layout ── */
        .login-page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* ── Form side ── */
        .login-form-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 3rem 2.5rem;
            background: var(--surface-2);
            overflow-y: auto;
            min-height: 100vh;
        }

        .login-form-card {
            width: 100%;
            max-width: 420px;
            padding-top: 1rem;
        }

        /* ── Back link ── */
        .login-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--lilac-deep);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: transform 0.3s var(--ease);
            text-decoration: none;
        }
        .login-back:hover { transform: translateX(-4px); }

        /* ── User grid ── */
        .select-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--plum-light);
            margin-bottom: 0.75rem;
            display: block;
        }

        /* Grid a 2 colonne su mobile, 3 su desktop */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }

        @media (min-width: 500px) {
            .user-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 0.75rem;
            border-radius: var(--r-sm, 8px);
            border: 2px solid var(--border);
            background: var(--white);
            color: var(--plum-dark);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            /* Minimum touch target */
            min-height: 44px;
        }

        .user-pill:hover {
            border-color: var(--lilac-mid);
            background: var(--ivory-2);
            transform: translateY(-1px);
        }

        .user-pill.selected {
            border-color: var(--lilac-deep);
            background: var(--lilac-deep);
            color: white;
            box-shadow: 0 4px 12px rgba(115, 86, 190, 0.3);
        }

        .user-pill .avatar-sm {
            width: 1.6rem;
            height: 1.6rem;
            min-width: 1.6rem;
            border-radius: 50%;
            background: var(--lilac-pale, rgba(179,160,221,0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--lilac-deep);
        }

        .user-pill.selected .avatar-sm {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        .pill-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        /* ── Form fields ── */
        .form-field { margin-bottom: 1.25rem; }

        /* ── Mobile overrides ── */
        @media (max-width: 640px) {
            .login-deco { display: none !important; }
            .login-page  { grid-template-columns: 1fr !important; }

            .login-form-side {
                padding: 1.5rem 1.25rem;
                align-items: stretch;
                justify-content: flex-start;
            }

            .login-form-card {
                max-width: 100%;
                padding-top: 0.5rem;
            }

            .login-back { margin-bottom: 1.25rem; }

            /* Titolo più compatto */
            .login-form-card h1 {
                font-size: clamp(1.5rem, 6vw, 2rem);
                margin-bottom: 0.4rem;
            }

            .login-form-card .login-form-subtitle {
                font-size: 0.9rem;
                margin-bottom: 1.25rem;
            }

            /* Griglia nomi: 2 colonne sempre su telefono */
            .user-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.4rem;
            }

            .user-pill {
                padding: 0.55rem 0.6rem;
                font-size: 0.82rem;
                min-height: 42px;
            }

            .user-pill .avatar-sm {
                width: 1.4rem;
                height: 1.4rem;
                min-width: 1.4rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-brand">Plot Twisters<span class="dot">!</span></div>
    </div>

    <div class="login-page">
        <!-- LEFT: Decorative Panel -->
        <div class="login-deco">
            <div class="login-deco-brand">Plot Twisters<span>!</span></div>
            <p class="login-deco-tagline">dove la magia prende vita, pagina dopo pagina</p>
            <div class="login-deco-dots">
                <span class="active"></span><span></span><span></span>
            </div>
            <div style="position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden" id="login-particles">
            </div>
        </div>

        <!-- RIGHT: Form Side -->
        <div class="login-form-side">
            <div class="login-form-card">

                <a href="index.html" class="login-back" title="Torna alla Homepage">
                    <i class="fas fa-arrow-left"></i> Home
                </a>

                <h1>Benvenuta <em>di nuovo</em></h1>
                <p class="login-form-subtitle">Scegli il tuo nome e inserisci la password ☕</p>

                <form class="login-form" id="login-form" novalidate>

                    <!-- Selezione Utente -->
                    <div style="margin-bottom:1.25rem;">
                        <span class="select-label">Chi sei? 👇</span>
                        <!-- User pills popolate da login.js -->
                        <div id="user-scroll" class="user-grid"></div>
                    </div>

                    <!-- Password -->
                    <div class="form-field">
                        <label for="login-password">La tua Password</label>
                        <input type="password" id="login-password" placeholder="••••••••"
                            autocomplete="current-password" required>
                    </div>

                    <div class="login-error hidden" id="login-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="login-error-msg">Password errata. Riprova!</span>
                    </div>

                    <button type="submit" class="btn-primary login-submit" id="login-submit-btn"
                        style="width:100%;justify-content:center;min-height:48px;">
                        Accedi <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <p style="margin-top:1.25rem;font-size:0.82rem;color:var(--plum-light);line-height:1.5;">
                    Non trovi il tuo nome o hai dimenticato la password? Contatta le admin! 🔑
                </p>

                <div style="margin-top:1.5rem;display:flex;justify-content:center;">
                    <button class="theme-toggle" id="theme-toggle-login" title="Cambia tema">🌙</button>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
